[package]
name = "emulator-debug-session"
version = "0.1.0"
edition = "2021"
description = "Debug session host for Nullbyte Directive"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
emulator-core = { workspace = true }
assembler = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_crate_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
