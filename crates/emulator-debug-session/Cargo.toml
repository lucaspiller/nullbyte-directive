[package]
name = "emulator-debug-session"
version = "0.1.0"
edition = "2021"
description = "Debug session host for Nullbyte Directive"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nullbyte-dap"
path = "src/bin/nullbyte-dap.rs"

[dependencies]
emulator-core = { workspace = true, features = ["serde"] }
assembler = { workspace = true }
dap = { git = "https://github.com/sztomi/dap-rs", rev = "913a2a520416a2a81a1f09a7946f595d5ae3ee4a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_crate_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
